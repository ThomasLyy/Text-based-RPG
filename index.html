<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text-based RPG</title>
    <meta name="description" content="A turn-based text roguelike: 3 acts, a branching map, one hero who adapts to what each run gives him." />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <!-- left: the act map (click a highlighted room to move), then the hero -->
      <aside id="left">
        <section id="mapbox" hidden><div id="map"></div></section>
        <section id="hero"></section>
      </aside>
      <!-- center: the current room (act and room as title, what happened in it), who you face, then your choices -->
      <section id="center">
        <fieldset id="room"><legend id="title"></legend><div id="log" aria-live="polite"></div></fieldset>
        <section id="board"></section>
        <section id="prompt">
          <p id="question"></p>
          <div id="options"></div>
        </section>
      </section>
      <!-- right: the hovered choice compared with your gear, then gear, spells and potions -->
      <aside id="right">
        <section id="compare"></section>
        <section id="gear"></section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
