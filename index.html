<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text-based RPG</title>
    <meta name="description" content="A turn-based text roguelike: 3 acts, a branching map, one hero who adapts to what each run gives him." />
    <meta name="theme-color" content="#12101c" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <!-- phones only: health and mana at all times, and which panel shows above the enemies -->
      <nav id="tabs">
        <div id="status"></div>
        <button data-tab="room">Room</button><button data-tab="map">Map</button><button data-tab="hero">Hero</button><button data-tab="gear">Gear</button>
      </nav>
      <!-- left: the act map (click a highlighted room to move), then the hero -->
      <aside id="left">
        <section id="mapbox"><div id="map"></div></section>
        <section id="hero"></section>
      </aside>
      <!-- center: the current room (act and room as title, what happened in it), who you face, then your choices -->
      <section id="center">
        <fieldset id="room"><legend id="title"></legend><div id="log" aria-live="polite"></div></fieldset>
        <section id="board"></section>
        <section id="prompt">
          <p id="question"></p>
          <div id="options"></div>
        </section>
      </section>
      <!-- right: gear, spells and potions, then the hovered choice compared with them -->
      <aside id="right">
        <section id="gear"></section>
        <section id="compare"></section>
      </aside>
    </main>
    <div id="fx" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
