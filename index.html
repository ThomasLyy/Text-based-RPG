<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text-based RPG</title>
    <meta name="description" content="A turn-based text roguelike: 15 floors, 3 bosses, one hero who adapts to what each run gives him." />
    <meta name="theme-color" content="#0d0f12" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <!-- left on wide screens: everything the hero carries -->
      <details id="sheet">
        <summary>Hero sheet</summary>
        <div id="hero"></div>
      </details>
      <!-- center: the fight and the choices, close together -->
      <section id="center">
        <section id="board"></section>
        <section id="prompt">
          <p id="question"></p>
          <div id="options"></div>
        </section>
      </section>
      <!-- right on wide screens: the hovered choice compared with your gear, then the log -->
      <aside id="side">
        <section id="compare"></section>
        <section id="log" aria-live="polite"></section>
      </aside>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
